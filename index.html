<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game Pro - SMKN 1 Sanden (RPL)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- GAYA DASAR & LATAR BELAKANG --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #fff;
            /* Latar belakang menggunakan gambar onesand.jpg dari GitHub */
            background: url('https://raw.githubusercontent.com/Nitaeka11/card_game2/48b47215d1001dd77e8318c599f08b5a4b5ea0dd/onesand.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 20px;
        }

        #ui-container {
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            max-width: 600px;
        }

        /* --- STYLING LOGO SEKOLAH & JURUSAN --- */
        .school-logos {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .school-logos img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border: 2px solid #2196F3;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* --- TOMBOL --- */
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover { background: #45a049; }
        button:active { transform: scale(0.95); }
        
        .btn-diff { background: #2196F3; }
        .btn-diff:hover { background: #1976D2; }
        .btn-diff.active { background: #FF9800; border: 2px solid #fff;}

        .btn-pause { background: #e91e63; }
        .btn-pause:hover { background: #c2185b; }

        .btn-hint { background: #9c27b0; }
        .btn-hint:hover { background: #7b1fa2; }

        .audio-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* --- PAPAN GAME & KARTU --- */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 100px); 
            gap: 15px;
            justify-content: center;
            perspective: 1000px;
            margin-top: 10px;
        }

        .card {
            width: 100px;
            height: 140px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .card-front {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }

        .card-back {
            background: #fff;
            color: #333;
            transform: rotateY(180deg);
        }

        /* --- NOTIFIKASI --- */
        #notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff9800;
            color: #000;
            padding: 15px 30px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .status-text { margin: 8px 0; font-size: 16px; }
        .divider { border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0; }
    </style>
</head>
<body>

    <div id="notification">Pesan Notifikasi!</div>

    <div id="ui-container">
        <div class="school-logos">
            <img src="https://raw.githubusercontent.com/Nitaeka11/card_game2/48b47215d1001dd77e8318c599f08b5a4b5ea0dd/smk.jpg" alt="Logo SMK N 1 Sanden" title="SMKN 1 Sanden">
            <img src="https://raw.githubusercontent.com/Nitaeka11/card_game2/48b47215d1001dd77e8318c599f08b5a4b5ea0dd/rpll.jpg" alt="Logo Jurusan RPL" title="Rekayasa Perangkat Lunak">
            <img src="https://raw.githubusercontent.com/Nitaeka11/card_game2/48b47215d1001dd77e8318c599f08b5a4b5ea0dd/bpk.jpg" alt="Logo Moko" title="Moko Game Projects">
        </div>

        <h1 style="margin-top: 5px; font-size: 24px;">Memory Game Pro - SMKN 1 Sanden</h1>
        
        <div class="audio-container">
            <strong style="display:block; margin-bottom: 5px;">🎵 Musik Latar Belakang:</strong>
            <audio id="bg-music" loop style="width: 100%; max-width: 300px;" controls>
                <source src="mixkit-tears-of-joy-839.mp3" type="audio/mpeg">
                Browser Anda tidak mendukung elemen audio.
            </audio>
        </div>

        <div>
            <strong style="display:block; margin-bottom: 5px;">1. Pilih Kesulitan:</strong>
            <button id="btn-mudah" class="btn-diff active" onclick="setDifficulty('mudah')">Mudah</button>
            <button id="btn-sedang" class="btn-diff" onclick="setDifficulty('sedang')">Sedang</button>
            <button id="btn-sulit" class="btn-diff" onclick="setDifficulty('sulit')">Sulit</button>
        </div>

        <div class="divider"></div>

        <div>
            <strong style="display:block; margin-bottom: 5px;">2. Mulai & Kontrol Game:</strong>
            <button onclick="startGame('P1_VS_COM')">Lawan Komputer</button>
            <button onclick="startGame('P1_VS_P2')">2 Pemain</button>
            <button id="btn-pause-game" class="btn-pause" onclick="togglePauseGame()">Pause Game</button>
            <button id="btn-hint-game" class="btn-hint" onclick="useHint()">💡 Bantuan (<span id="hint-count">2</span>)</button>
        </div>

        <div class="divider"></div>

        <p class="status-text">
            <strong>Kesulitan:</strong> <span id="diff-label" style="color: #FF9800;">Mudah</span> | 
            <strong>Level:</strong> <span id="level">1</span> | 
            <strong>Waktu:</strong> <span id="time">60</span> detik
        </p>
        <p class="status-text">
            <strong>Giliran:</strong> <span id="turn-indicator" style="color:#4CAF50;">Pemain 1</span>
        </p>
        <p class="status-text">
            Skor P1: <span id="score1">0</span> | Skor Lawan: <span id="score2">0</span>
        </p>
        <p class="status-text" style="color: #FFD700;">
            🏆 <strong>Rekor Tertinggi:</strong> <span id="high-score">0</span>
        </p>
    </div>

    <div id="game-board"></div>

    <script>
        const allSymbols = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐯', '🦁', '🐮', '🐷']; 
        let activeSymbols = [];
        
        let firstCard, secondCard;
        let lockBoard = false;
        let isGamePaused = false;
        let gameMode = 'P1_VS_COM';
        let difficulty = 'mudah'; 
        
        let currentPlayer = 1;
        let score1 = 0, score2 = 0;
        let matchedPairs = 0;
        let hintsLeft = 2;
        
        let level = 1;
        let timeLeft = 60;
        let timerInterval;

        const board = document.getElementById('game-board');
        const notif = document.getElementById('notification');
        const pauseBtn = document.getElementById('btn-pause-game');
        
        // Elemen Musik Latar & Efek Suara (SFX)
        const bgMusic = document.getElementById('bg-music');
        const flipSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
        const matchSfx = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3');

        // Muat Rekor Tertinggi
        let highScore = localStorage.getItem('memory_high_score') || 0;
        document.getElementById('high-score').innerText = highScore;

        function setDifficulty(diff) {
            difficulty = diff;
            document.querySelectorAll('.btn-diff').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${diff}`).classList.add('active');
            
            const labelStr = diff.charAt(0).toUpperCase() + diff.slice(1);
            document.getElementById('diff-label').innerText = labelStr;
            
            showNotification(`Kesulitan diubah ke: ${labelStr}`);
        }

        function startGame(mode) {
            gameMode = mode;
            level = 1;
            hintsLeft = 2;
            document.getElementById('hint-count').innerText = hintsLeft;
            isGamePaused = false;
            pauseBtn.innerText = "Pause Game";
            resetScores();
            setupLevel();
            
            if (bgMusic) {
                bgMusic.play().catch(() => {});
            }

            showNotification(`Mode: ${mode === 'P1_VS_COM' ? 'Lawan Komputer' : '2 Pemain'} Dimulai!`);
        }

        function setupLevel() {
            board.innerHTML = '';
            matchedPairs = 0;
            currentPlayer = 1;
            isGamePaused = false;
            pauseBtn.innerText = "Pause Game";
            updateTurnIndicator();
            
            if (difficulty === 'mudah') {
                activeSymbols = allSymbols.slice(0, 6); 
                board.style.gridTemplateColumns = 'repeat(4, 100px)'; 
                timeLeft = 60 - (level * 2);
            } else if (difficulty === 'sedang') {
                activeSymbols = allSymbols.slice(0, 8); 
                board.style.gridTemplateColumns = 'repeat(4, 100px)'; 
                timeLeft = 75 - (level * 3);
            } else if (difficulty === 'sulit') {
                activeSymbols = allSymbols.slice(0, 12); 
                board.style.gridTemplateColumns = 'repeat(6, 100px)'; 
                timeLeft = 90 - (level * 5);
            }

            let deck = [...activeSymbols, ...activeSymbols];
            deck.sort(() => 0.5 - Math.random()); 

            deck.forEach(symbol => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;
                
                card.innerHTML = `
                    <div class="card-face card-front">❓</div>
                    <div class="card-face card-back">${symbol}</div>
                `;
                
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });

            startTimer();
        }

        function flipCard() {
            if (lockBoard || isGamePaused) return;
            if (this === firstCard) return;

            // Bunyi SFX balik kartu
            flipSfx.currentTime = 0;
            flipSfx.play().catch(() => {});

            this.classList.add('flipped');

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;

            if (isMatch) {
                // Bunyi SFX jika kartu cocok
                matchSfx.currentTime = 0;
                matchSfx.play().catch(() => {});

                disableCards();
                updateScore();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;
            
            resetBoard();

            if (matchedPairs === activeSymbols.length) {
                levelComplete();
            } else if (gameMode === 'P1_VS_COM' && currentPlayer === 2 && !isGamePaused) {
                setTimeout(aiTurn, 1000); 
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                if(firstCard) firstCard.classList.remove('flipped');
                if(secondCard) secondCard.classList.remove('flipped');
                resetBoard();
                switchTurn();
            }, 1000);
        }

        function resetBoard() {
            [firstCard, secondCard] = [null, null];
            lockBoard = false;
        }

        function switchTurn() {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateTurnIndicator();

            if (gameMode === 'P1_VS_COM' && currentPlayer === 2 && !isGamePaused) {
                setTimeout(aiTurn, 1000);
            }
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turn-indicator');
            indicator.innerText = currentPlayer === 1 ? "Pemain 1" : (gameMode === 'P1_VS_COM' ? "Komputer" : "Pemain 2");
            indicator.style.color = currentPlayer === 1 ? "#4CAF50" : "#f44336";
        }

        function aiTurn() {
            if (currentPlayer !== 2 || matchedPairs === activeSymbols.length || isGamePaused) return;

            let unflipped = Array.from(document.querySelectorAll('.card:not(.flipped)'));
            if (unflipped.length < 2) return;

            let idx1 = Math.floor(Math.random() * unflipped.length);
            let aiCard1 = unflipped[idx1];
            aiCard1.click();

            setTimeout(() => {
                if (isGamePaused) return;
                unflipped = Array.from(document.querySelectorAll('.card:not(.flipped)'));
                if (unflipped.length === 0) return;
                let idx2 = Math.floor(Math.random() * unflipped.length);
                let aiCard2 = unflipped[idx2];
                aiCard2.click();
            }, 600);
        }

        function updateScore() {
            if (currentPlayer === 1) {
                score1 += 10;
                document.getElementById('score1').innerText = score1;
                checkHighScore(score1);
            } else {
                score2 += 10;
                document.getElementById('score2').innerText = score2;
            }
            showNotification(`+10 Poin untuk ${currentPlayer === 1 ? 'Pemain 1' : (gameMode === 'P1_VS_COM' ? 'Komputer' : 'Pemain 2')}!`);
        }

        function checkHighScore(currentScore) {
            if (currentScore > highScore) {
                highScore = currentScore;
                localStorage.setItem('memory_high_score', highScore);
                document.getElementById('high-score').innerText = highScore;
            }
        }

        function resetScores() {
            score1 = 0; score2 = 0;
            document.getElementById('score1').innerText = score1;
            document.getElementById('score2').innerText = score2;
        }

        function startTimer() {
            clearInterval(timerInterval);
            if(timeLeft < 15) timeLeft = 15; 
            
            document.getElementById('time').innerText = timeLeft;

            timerInterval = setInterval(() => {
                if (!isGamePaused) {
                    timeLeft--;
                    document.getElementById('time').innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        showNotification("Waktu Habis! Game Over.");
                        lockBoard = true;
                        if (bgMusic) bgMusic.pause();
                    }
                }
            }, 1000);
        }

        function togglePauseGame() {
            isGamePaused = !isGamePaused;

            if (isGamePaused) {
                pauseBtn.innerText = "Lanjutkan Game";
                showNotification("Game Di-pause!");
                if (bgMusic) bgMusic.pause();
            } else {
                pauseBtn.innerText = "Pause Game";
                showNotification("Game Dilanjutkan!");
                if (bgMusic) bgMusic.play().catch(() => {});

                if (gameMode === 'P1_VS_COM' && currentPlayer === 2) {
                    setTimeout(aiTurn, 1000);
                }
            }
        }

        function useHint() {
            if (isGamePaused || lockBoard) return;
            if (hintsLeft <= 0) {
                showNotification("Bantuan / Hint sudah habis!");
                return;
            }

            hintsLeft--;
            document.getElementById('hint-count').innerText = hintsLeft;
            lockBoard = true;

            const cards = document.querySelectorAll('.card:not(.flipped)');
            cards.forEach(card => card.classList.add('flipped'));

            setTimeout(() => {
                cards.forEach(card => card.classList.remove('flipped'));
                lockBoard = false;
            }, 1000);

            showNotification("Mengintip Kartu Selama 1 Detik!");
        }

        function levelComplete() {
            clearInterval(timerInterval);
            
            // Efek Konfeti Berterbangan saat Menang
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });

            showNotification(`Level ${level} Selesai! Memuat level berikutnya...`);
            level++;
            document.getElementById('level').innerText = level;
            setTimeout(setupLevel, 2500);
        }

        function showNotification(msg) {
            notif.innerText = msg;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 2000);
        }
    </script>
</body>
</html>
